name: LunesHost Keepalive

on:
  schedule:
    - cron: '07 15 * * *' # 每天定时运行
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. 安装 Sing-box (用于启动 HY2 代理)
      - name: Install sing-box (for HY2 Proxy)
        run: |
          echo "正在安装 sing-box 客户端..."
          LATEST_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION=${LATEST_TAG#v}
          curl -LO "https://github.com/SagerNet/sing-box/releases/download/${LATEST_TAG}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${VERSION}-linux-amd64.tar.gz"
          sudo mv "sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/
          chmod +x /usr/local/bin/sing-box
          sing-box version

      # 2. 安装 Ubuntu GUI 系统依赖 (供 PyAutoGUI 物理点击使用)
      - name: Install System GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-dev scrot

      # 3. 安装 Python 依赖库
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyautogui

      # 4. 运行保活脚本
      - name: Run Lunes Keepalive Script
        env:
          HY2_URL: ${{ secrets.HY2_URL }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
          LUNES_SERVER_URL: ${{ secrets.LUNES_SERVER_URL }}
        run: |
          python lunes_run.py

      # 5. 清理历史工作流记录
      - name: Auto Clean Old Workflow Runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清理历史工作流记录..."
          CURRENT_RUN_ID="${{ github.run_id }}"
          RUNS=$(gh run list --workflow="${{ github.workflow }}" --json databaseId -q '.[].databaseId')
          for run_id in $RUNS; do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              gh run delete "$run_id" --repo "${{ github.repository }}" || true
            fi
          done
