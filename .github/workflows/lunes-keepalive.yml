name: LunesHost Keepalive

on:
  schedule:
    - cron: '07 15 * * *' # 每天定时运行
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 安装 Ubuntu 物理过盾所需的虚拟显示屏 (Xvfb) 和 GUI 依赖
      - name: Install System GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-dev scrot

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyautogui

      - name: Run Lunes Keepalive Script
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LUNES_EMAIL: ${{ secrets.LUNES_EMAIL }}
          LUNES_PASSWORD: ${{ secrets.LUNES_PASSWORD }}
          LUNES_SERVER_URL: ${{ secrets.LUNES_SERVER_URL }}
        run: |
          python lunes_run.py

      - name: Auto Clean Old Workflow Runs (Keep Current Only)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清理历史工作流记录，仅保留当前一条记录..."
          CURRENT_RUN_ID="${{ github.run_id }}"
          RUNS=$(gh run list --workflow="${{ github.workflow }}" --json databaseId -q '.[].databaseId')
          for run_id in $RUNS; do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              echo "正在删除旧纪录 ID: $run_id"
              gh run delete "$run_id" --repo "${{ github.repository }}" || true
            fi
          done
